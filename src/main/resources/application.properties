spring.application.name=product-services

# --- CONFIGURACIÓN HÍBRIDA (NUBE / LOCAL) ---

# Puerto: Railway nos asigna uno dinámico en la variable PORT.
# Si no encuentra esa variable (en tu PC), usa el 8080.
server.port=8080
?
# URL de Base de Datos:
# Busca una variable de entorno llamada 'MYSQL_URL'.
# Si no la encuentra (en tu PC), usa tu conexión local a 'testdb'.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/testdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}

# Usuario: Busca 'MYSQLUSER', si no, usa 'root'
spring.datasource.username=${MYSQLUSER:root}

# Contraseña: Busca 'MYSQLPASSWORD', si no, usa 'root'
spring.datasource.password=${MYSQLPASSWORD:root}

# --- CONFIGURACIÓN ESTÁNDAR ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ---- CONFIGURACIÓN SECURITY  -------#

spring.security.user.name=azuka
spring.security.user.password=azuka123