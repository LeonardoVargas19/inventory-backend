spring.application.name=product-services

# --- CONFIGURACION HIBRIDA (NUBE / LOCAL) ---

# Puerto: Railway nos asigna uno dinamico en la variable PORT.
# Si no encuentra esa variable (en tu PC), usa el 8080.
server.port=8080

# URL de Base de Datos:
# Busca una variable de entorno llamada 'MYSQL_URL'.
# Si no la encuentra (en tu PC), usa tu conexion local a 'testdb'.
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/testdb?allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=UTC}

# Usuario: Busca 'MYSQLUSER', si no, usa 'root'
spring.datasource.username=${MYSQLUSER:root}

# Password: Busca 'MYSQLPASSWORD', si no, usa 'root'
spring.datasource.password=${MYSQLPASSWORD:root}

# --- CONFIGURACION ESTANDAR ---
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---- CONFIGURACION SECURITY -------#
spring.security.user.name=azuka
spring.security.user.password=azuka123

# ---- CONFIGURACION EUREKA -------#
eureka.client.serviceUrl.defaultZone=http://localhost:8761/eureka

# ---- CONFIGURACION ACTUATOR -------#
management.endpoints.web.exposure.include=*
management.endpoint.info.enabled=true
management.info.env.enabled=true
